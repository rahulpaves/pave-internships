<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pave Internships UAE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ground:#F4F8FB;
  --surface:#FFFFFF;
  --surface-2:#EDF4F9;
  --ink:#15212C;
  --ink-2:#4B5C6B;
  --ink-3:#7B8B99;
  --line:#DFE9F1;
  --brand:#0F73B8;
  --brand-deep:#0A4E7D;
  --brand-soft:#E3F0F9;
  --on-brand:#FFFFFF;
  --sun:#E8942C;
  --sun-soft:#FCEFDC;
  --coral:#E2624B;
  --shadow:0 1px 2px rgba(17,45,70,.05), 0 10px 30px -16px rgba(17,45,70,.28);
  --shadow-lift:0 2px 4px rgba(17,45,70,.06), 0 20px 40px -18px rgba(17,45,70,.34);

  --c-tech:#2D6BE4;
  --c-med:#CE4459;
  --c-aero:#0D85A6;
  --c-avio:#5566CC;
  --c-psy:#8A4FB0;
  --c-biz:#D07C22;
  --c-mech:#4C8A3C;
  --c-sport:#0D9076;
  --c-vet:#6F8C1E;
  --c-mkt:#BE3D84;
  --c-film:#CF4F2E;
  --c-cyber:#3E5266;

  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;

  --r:14px;
  --r-lg:22px;
  --w:72rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141A;
    --surface:#151F27;
    --surface-2:#1B2833;
    --ink:#E9F1F7;
    --ink-2:#AEBFCC;
    --ink-3:#7D8F9D;
    --line:#25333E;
    --brand:#63B4E8;
    --brand-deep:#9CD2F3;
    --brand-soft:#14303F;
    --on-brand:#0B1720;
    --sun:#F0B266;
    --sun-soft:#2D2413;
    --coral:#EE8570;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 22px 44px -20px rgba(0,0,0,.8);

    --c-tech:#8FB4FA;
    --c-med:#F1909F;
    --c-aero:#6FC9E4;
    --c-avio:#A3AEF2;
    --c-psy:#C9A2E8;
    --c-biz:#EFB268;
    --c-mech:#A4CE8C;
    --c-sport:#5FD2B2;
    --c-vet:#C3D585;
    --c-mkt:#F094C6;
    --c-film:#F2916F;
    --c-cyber:#A9BDD1;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141A;
  --surface:#151F27;
  --surface-2:#1B2833;
  --ink:#E9F1F7;
  --ink-2:#AEBFCC;
  --ink-3:#7D8F9D;
  --line:#25333E;
  --brand:#63B4E8;
  --brand-deep:#9CD2F3;
  --brand-soft:#14303F;
  --on-brand:#0B1720;
  --sun:#F0B266;
  --sun-soft:#2D2413;
  --coral:#EE8570;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 22px 44px -20px rgba(0,0,0,.8);

  --c-tech:#8FB4FA;
  --c-med:#F1909F;
  --c-aero:#6FC9E4;
  --c-avio:#A3AEF2;
  --c-psy:#C9A2E8;
  --c-biz:#EFB268;
  --c-mech:#A4CE8C;
  --c-sport:#5FD2B2;
  --c-vet:#C3D585;
  --c-mkt:#F094C6;
  --c-film:#F2916F;
  --c-cyber:#A9BDD1;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:1rem;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%;}
a{color:inherit;}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:3px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

.wrap{width:min(100% - 2.5rem,var(--w));margin-inline:auto;}
.eyebrow{
  font-size:.75rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0;
}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;}

/* ============ header ============ */
.site-head{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.head-in{display:flex;align-items:center;gap:1.5rem;padding-block:.85rem;}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-weight:700;}
.brand-mark{
  width:2rem;height:2rem;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--brand),var(--brand-deep));
  color:var(--on-brand);display:grid;place-items:center;
  font-family:var(--display);font-size:1.05rem;line-height:1;
}
.brand-name{font-family:var(--display);font-size:1.15rem;}
.brand-name em{font-style:normal;color:var(--ink-3);font-weight:400;}
.nav{margin-left:auto;display:flex;align-items:center;gap:.35rem;}
.nav button,.nav a.navlink{
  font:inherit;font-size:.9rem;font-weight:500;
  background:none;border:0;cursor:pointer;color:var(--ink-2);
  padding:.5rem .7rem;border-radius:99px;text-decoration:none;
  transition:background-color .18s,color .18s;
}
.nav button:hover,.nav a.navlink:hover{background:var(--surface-2);color:var(--ink);}
@media (max-width:52rem){ .nav .hide-sm{display:none;} }

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font:inherit;font-weight:600;font-size:.95rem;
  padding:.72rem 1.25rem;border-radius:99px;border:1.5px solid transparent;
  text-decoration:none;cursor:pointer;
  transition:transform .16s,box-shadow .18s,background-color .18s;
}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 8px 18px -10px var(--brand);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px var(--brand);}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow);}
.btn-ghost:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}

/* ============ hero ============ */
.hero{position:relative;overflow:hidden;}
.hero::before{
  content:"";position:absolute;inset:-30% -10% auto -10%;height:150%;
  background:
    radial-gradient(45rem 26rem at 18% 12%, var(--brand-soft), transparent 65%),
    radial-gradient(38rem 22rem at 88% 4%, var(--sun-soft), transparent 62%);
  pointer-events:none;
}
.hero-in{position:relative;padding-block:clamp(3rem,7vw,5.5rem) clamp(2.5rem,5vw,4rem);}
.hero h1{
  font-size:clamp(2.4rem,1.4rem + 4.2vw,4.4rem);
  line-height:1.03;letter-spacing:-.028em;margin-top:1rem;max-width:15ch;
}
.hero h1 .hl{
  color:var(--brand-deep);
  background:linear-gradient(transparent 62%, color-mix(in srgb,var(--sun) 42%,transparent) 62%);
}
.hero-sub{font-size:clamp(1.05rem,1rem + .4vw,1.25rem);color:var(--ink-2);max-width:52ch;margin:1.35rem 0 0;}
.hero-cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem;}
.trust{
  display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2.5rem;
}
.trust span{
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:.42rem .9rem;font-size:.85rem;font-weight:500;color:var(--ink-2);
  box-shadow:var(--shadow);
}
.trust span b{color:var(--ink);font-weight:700;}

/* ============ sections ============ */
section.band{padding-block:clamp(3rem,6vw,5rem);}
.sec-head{max-width:44ch;margin-bottom:2.25rem;}
.sec-head h2{font-size:clamp(1.75rem,1.4rem + 1.4vw,2.5rem);line-height:1.1;margin-top:.6rem;}
.sec-head p{color:var(--ink-2);margin:.85rem 0 0;}

/* ============ search ============ */
.search-row{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.25rem;margin-bottom:1.75rem;}
.search{
  display:flex;align-items:center;gap:.65rem;flex:1 1 20rem;max-width:28rem;
  background:var(--surface);border:1.5px solid var(--line);border-radius:99px;
  padding:.62rem 1.1rem;box-shadow:var(--shadow);
  transition:border-color .18s,box-shadow .18s;
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);}
.search svg{color:var(--ink-3);flex:none;}
.search input{
  flex:1;min-width:0;border:0;background:none;outline:none;
  font:inherit;font-size:1rem;color:var(--ink);
}
.search input::placeholder{color:var(--ink-3);}
.search .clear{
  flex:none;border:0;background:var(--surface-2);color:var(--ink-2);cursor:pointer;
  width:1.5rem;height:1.5rem;border-radius:50%;font-size:1rem;line-height:1;
  display:none;place-items:center;padding:0;
}
.search .clear:hover{background:var(--brand-soft);color:var(--ink);}
.search.has-value .clear{display:grid;}
.result-count{font-size:.92rem;color:var(--ink-3);}
.result-count b{color:var(--ink);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.75rem;}
.chips button{
  font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  padding:.4rem .85rem;border-radius:99px;box-shadow:var(--shadow);
  transition:background-color .16s,color .16s,border-color .16s;
}
.chips button:hover{color:var(--ink);border-color:var(--brand);}
.no-results{
  grid-column:1/-1;text-align:center;padding:3rem 1.25rem;
  background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-lg);
}
[hidden]{display:none !important;}
.no-results h3{font-size:1.3rem;margin-bottom:.4rem;}
.no-results p{color:var(--ink-2);margin:0;}

/* ============ programme cards ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.25rem;}
.card{
  --c:var(--brand);
  display:flex;flex-direction:column;gap:.85rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:1.5rem 1.4rem 1.25rem;
  text-decoration:none;color:inherit;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:auto -25% -70% auto;width:18rem;height:18rem;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--c) 0%, transparent 68%);
  opacity:.16;transition:opacity .25s ease,transform .3s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--c) 40%,var(--line));}
.card:hover::after{opacity:.3;transform:scale(1.15);}
.card-ico{
  width:3rem;height:3rem;border-radius:14px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 13%,var(--surface));
  color:var(--c);position:relative;z-index:1;
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;position:relative;z-index:1;}
.card-field{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c);}
.card-city{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.card h3{font-size:1.4rem;line-height:1.16;position:relative;z-index:1;}
.card p{margin:0;color:var(--ink-2);font-size:.95rem;flex:1;position:relative;z-index:1;}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  border-top:1px solid var(--line);padding-top:.9rem;margin-top:.35rem;
  font-size:.88rem;position:relative;z-index:1;
}
.card-foot .len{color:var(--ink-3);}
.card-foot .fee{font-weight:700;font-variant-numeric:tabular-nums;}

/* ============ steps ============ */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.25rem;}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem 1.4rem;box-shadow:var(--shadow);}
.step-n{
  width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand-deep);
  font-family:var(--display);font-weight:700;font-size:1rem;margin-bottom:.9rem;
}
.step h3{font-size:1.2rem;margin-bottom:.4rem;}
.step p{margin:0;color:var(--ink-2);font-size:.95rem;}

/* ============ parents band ============ */
.parents{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:calc(var(--r-lg) + 8px);
  padding:clamp(1.75rem,4vw,3rem);
  box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(1.5rem,4vw,3.5rem);
  align-items:start;
}
@media (max-width:50rem){ .parents{grid-template-columns:1fr;} }
.parents h2{font-size:clamp(1.6rem,1.3rem + 1.2vw,2.25rem);line-height:1.12;margin-top:.6rem;}
.parents > div > p{color:var(--ink-2);margin:.85rem 0 0;}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:.9rem;}
.checks li{display:grid;grid-template-columns:1.5rem 1fr;gap:.85rem;align-items:start;font-size:.98rem;}
.checks svg{margin-top:.28rem;color:var(--brand);}
.checks b{display:block;font-weight:700;}
.checks span{color:var(--ink-2);font-size:.92rem;}

/* ============ faq ============ */
.faq{display:grid;gap:.7rem;max-width:52rem;}
.faq details{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:0 1.15rem;box-shadow:var(--shadow);
}
.faq summary{
  cursor:pointer;list-style:none;padding:1.05rem 2rem 1.05rem 0;position:relative;
  font-weight:600;font-size:1.02rem;
}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{
  content:"";position:absolute;right:.25rem;top:1.45rem;width:.6rem;height:.6rem;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .2s ease;
}
.faq details[open] summary::after{transform:rotate(-135deg);}
.faq p{margin:0 0 1.15rem;color:var(--ink-2);font-size:.95rem;max-width:60ch;}

/* ============ detail ============ */
.d-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
.d-hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--ground)),var(--ground) 72%);
}
.d-hero-in{position:relative;padding-block:1.5rem clamp(2rem,4vw,3rem);}
.back{
  display:inline-flex;align-items:center;gap:.45rem;text-decoration:none;
  font-size:.9rem;font-weight:600;color:var(--ink-2);
  padding:.45rem .85rem .45rem .6rem;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.back:hover{color:var(--c);}
.d-badge{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:1.75rem;
  color:var(--c);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.d-badge .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);}
.d-hero h1{font-size:clamp(2.1rem,1.4rem + 3vw,3.5rem);line-height:1.05;letter-spacing:-.025em;margin-top:.75rem;max-width:20ch;}
.d-kicker{font-family:var(--display);font-size:clamp(1.05rem,1rem + .4vw,1.3rem);color:var(--ink-2);margin:.9rem 0 0;max-width:46ch;}
.pills{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.75rem;}
.pills span{
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:.45rem .95rem;font-size:.87rem;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow);
}
.pills span b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}

.d-body{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:clamp(1.5rem,4vw,3.5rem);padding-block:clamp(2rem,4vw,3.25rem) 4rem;align-items:start;}
@media (max-width:56rem){ .d-body{grid-template-columns:1fr;} }
.lede{font-size:1.15rem;line-height:1.65;color:var(--ink);margin:0;max-width:62ch;}
.d-sec{margin-top:2.75rem;}
.d-sec > h2{font-size:1.5rem;margin-bottom:1.25rem;}

.timeline{list-style:none;margin:0;padding:0 0 0 1.9rem;position:relative;}
.timeline::before{content:"";position:absolute;left:.42rem;top:.55rem;bottom:.55rem;width:2px;background:var(--line);}
.timeline li{position:relative;padding-bottom:1.5rem;}
.timeline li:last-child{padding-bottom:0;}
.timeline li::before{
  content:"";position:absolute;left:-1.9rem;top:.42rem;width:.95rem;height:.95rem;border-radius:50%;
  background:var(--surface);border:3px solid var(--c);
}
.tl-tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);}
.timeline h3{font-size:1.15rem;margin-top:.2rem;}
.timeline p{margin:.3rem 0 0;color:var(--ink-2);font-size:.95rem;max-width:56ch;}

.outcomes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.7rem;}
.outcomes li{
  display:grid;grid-template-columns:1.35rem 1fr;gap:.75rem;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:.9rem 1rem;font-size:.95rem;box-shadow:var(--shadow);
}
.outcomes svg{margin-top:.25rem;color:var(--c);}

.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem;}
.tags li{
  background:color-mix(in srgb,var(--c) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  color:var(--ink);border-radius:99px;padding:.42rem .95rem;font-size:.9rem;font-weight:500;
}
.note{
  margin-top:1.75rem;padding:1.1rem 1.25rem;border-radius:var(--r);
  background:color-mix(in srgb,var(--c) 8%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));
  color:var(--ink-2);font-size:.95rem;
}
.note b{color:var(--ink);}
.motto{
  margin-top:2.5rem;font-family:var(--display);font-weight:600;
  font-size:clamp(1.3rem,1.1rem + 1vw,1.9rem);line-height:1.2;color:var(--c);text-wrap:balance;
}

.aside{position:sticky;top:5.5rem;display:grid;gap:1rem;}
@media (max-width:56rem){ .aside{position:static;} }
.apply{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.4rem;box-shadow:var(--shadow-lift);
}
.apply h2{font-size:1.2rem;}
.apply p{color:var(--ink-2);font-size:.92rem;margin:.6rem 0 0;}
.facts{list-style:none;margin:1.1rem 0 1.25rem;padding:0;display:grid;gap:.05rem;}
.facts li{display:flex;justify-content:space-between;gap:1rem;padding:.62rem 0;border-bottom:1px solid var(--line);font-size:.93rem;}
.facts li:last-child{border-bottom:0;}
.facts dt,.facts .k{color:var(--ink-3);}
.facts .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.facts .v small{display:block;font-weight:400;color:var(--ink-3);font-size:.78rem;}
.apply .btn{width:100%;}
.contact-stub{
  border:1.5px dashed var(--line);border-radius:99px;padding:.72rem 1rem;
  text-align:center;font-weight:600;font-size:.95rem;color:var(--ink-2);
}

.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line);}
.pager a{text-decoration:none;max-width:17rem;}
.pager .dir{display:block;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.pager .nm{display:block;font-family:var(--display);font-weight:600;font-size:1.02rem;margin-top:.25rem;}
.pager a:hover .nm{color:var(--brand);}
.pager .next{text-align:right;margin-left:auto;}

/* ============ footer ============ */
.site-foot{border-top:1px solid var(--line);background:var(--surface);}

      <span class="card-ico">${ICONS[p.icon]}</span>

        <span class="card-city">${p.location ? esc(p.location) : ""}</span>
      </span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.blurb)}</p>
      <span class="card-foot">
        <span class="len">${p.length ? esc(p.length) : ""}</span>
        <span class="fee">${p.fee ? esc(p.fee) : "Fee on request"}</span>

function wireSearch(){
  const box   = document.getElementById("search-box");
  const input = document.getElementById("search");
  const clear = document.getElementById("search-clear");
  const count = document.getElementById("result-count");
  const empty = document.getElementById("no-results");
  const cards = [...document.querySelectorAll(".card")];
  if (!input) return;

  const apply = () => {
    const q = input.value.trim().toLowerCase();
    box.classList.toggle("has-value", q.length > 0);
    let shown = 0;
    cards.forEach(c => {
      const hit = !q || c.dataset.search.includes(q);
      c.hidden = !hit;
      if (hit) shown++;
    });
    empty.hidden = shown > 0;
    count.innerHTML = q
      ? `<b>${shown}</b> of ${cards.length} programmes match &ldquo;${esc(input.value.trim())}&rdquo;`
      : `Showing all <b>${cards.length}</b> programmes`;
  };

  input.addEventListener("input", apply);
  input.addEventListener("keydown", e => { if (e.key === "Escape") { input.value = ""; apply(); } });
  clear.addEventListener("click", () => { input.value = ""; apply(); input.focus(); });
  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest("button[data-term]");
    if (!b) return;
    input.value = input.value.trim().toLowerCase() === b.dataset.term.toLowerCase() ? "" : b.dataset.term;
    apply();
    input.focus();
  });
  apply();
}

function scrollToSection(id){
  const go = () => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  };
  if (location.hash && location.hash !== "#/" && location.hash !== "#"){
    location.hash = "#/";
    setTimeout(go, 60);
  } else {
    go();
  }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-scroll]");
  if (t) { e.preventDefault(); scrollToSection(t.dataset.scroll); }
});

function route(){

  if (i === -1) renderHome(); else renderDetail(PROGRAMMES[i], i);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
